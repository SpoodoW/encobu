[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "encobu"
version = "1.0.0"
description = "A modern, lightweight CLI tool to encode, obfuscate and test payloads against YARA detection rules and generate evasion reports." 
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SpoodoW" }
]
dependencies = [
    "rich>=14.0.0",
    "yara-x>=1.0.0",
]

[project.scripts]
encobu = "encobu.cli:main"